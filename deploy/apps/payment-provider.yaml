apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-provider
  labels: &labels
    app.kubernetes.io/name: payment-provider
    app.kubernetes.io/part-of: shop
    shop.dev/owner: external-stripe
    shop.dev/tier: external
  annotations:
    shop.dev/aliases: "stripe,psp"
    shop.dev/depends-on: ""
    shop.dev/runbook: "context/runbooks/payment-provider.md"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-provider
  template:
    metadata:
      labels: *labels
    spec:
      containers:
        - name: payment-provider
          image: shop/python:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE
              value: "payment_provider"
            - name: OTEL_SERVICE_NAME
              value: "payment-provider"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability:4318"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=shop,deployment.environment=prod,service.owner=external-stripe"
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: payment-provider
  labels:
    app.kubernetes.io/name: payment-provider
spec:
  selector:
    app.kubernetes.io/name: payment-provider
  ports:
    - port: 8080
      targetPort: 8080
