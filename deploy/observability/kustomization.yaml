apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - otel-collector.yaml
  - jaeger.yaml
  - prometheus.yaml
  - kube-state-metrics.yaml
  - grafana.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: prometheus-config
    files: [prometheus.yml]
  - name: prometheus-rules
    files: [slo.yaml=prometheus-rules.yaml]
  - name: alertmanager-config
    files: [alertmanager.yml]
  - name: grafana-datasources
    files: [datasources.yaml=grafana-datasources.yaml]
  - name: grafana-dashboards
    files: [providers.yaml=grafana-dashboards.yaml]
  - name: grafana-dashboard-checkout
    files: [dashboard-checkout.json]
