global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/rules/*.yaml]
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]
scrape_configs:
  - job_name: otel-collector
    honor_labels: true
    static_configs: [{ targets: ["otel-collector:8889"] }]
  - job_name: kube-state-metrics
    static_configs: [{ targets: ["kube-state-metrics:8080"] }]
  - job_name: cadvisor
    scheme: https
    tls_config: { insecure_skip_verify: true }
    authorization: { credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token }
    kubernetes_sd_configs: [{ role: node }]
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
